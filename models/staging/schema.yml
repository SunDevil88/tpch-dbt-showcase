version: 2

models:
  - name: stg_orders
    description: "Cleaned and renamed orders data"
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned and renamed customers data"
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null

  - name: stg_lineitems
    description: "Cleaned and renamed lineitems data"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: part_id
        tests:
          - not_null

  - name: stg_suppliers
    description: "Cleaned and renamed suppliers data"
    columns:
      - name: supplier_id
        description: "Primary key"
        tests:
          - unique
          - not_null

  - name: stg_parts
    description: "Cleaned and renamed parts data"
    columns:
      - name: part_id
        description: "Primary key"
        tests:
          - unique
          - not_null